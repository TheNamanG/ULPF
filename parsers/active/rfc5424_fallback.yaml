# =============================================================================
# ULPF Parser: RFC 5424 Syslog Fallback
# =============================================================================
# Generic RFC 5424 syslog parser — catch-all for log lines that don't match
# any vendor-specific parser. Maps to OCSF Base Event (class_uid=0).
# =============================================================================

name: rfc5424_fallback
version: "1.0.0"
author: human
created_at: "2026-09-06T00:00:00Z"
description: >
  Generic RFC 5424 structured syslog parser. Acts as the lowest-priority
  catch-all so that well-formed syslog messages produce a normalized OCSF
  Base Event rather than being sent to the DLQ. Extracts facility, severity,
  hostname, app-name, procid, msgid, structured data, and message.

vendor: generic
log_format: syslog
match_priority: 999

ocsf_class: base_event
ocsf_category_uid: 0
ocsf_class_uid: 0

match_patterns:
  # Full RFC 5424: <PRI>VERSION TIMESTAMP HOSTNAME APP-NAME PROCID MSGID [SD] MSG
  # Example: <134>1 2026-09-06T10:00:00.000Z myhost myapp 1234 ID47 [exampleSDID@32473 iut="3"] message
  - '<(?P<pri>\d{1,3})>(?P<version>\d+)\s+(?P<timestamp>\S+)\s+(?P<hostname>\S+)\s+(?P<app_name>\S+)\s+(?P<procid>\S+)\s+(?P<msgid>\S+)\s+(?:\[(?P<structured_data>[^\]]*)\]\s*)?(?P<message>.*)'
  # BSD-style (RFC 3164) fallback: <PRI>TIMESTAMP HOSTNAME MSG
  - '<(?P<pri>\d{1,3})>(?P<timestamp>\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?P<hostname>\S+)\s+(?P<message>.*)'

field_mappings:
  - ocsf_field: message
    type: str
    jinja2_template: "{{ message | default('') | trim }}"

  - ocsf_field: metadata.product.name
    type: str
    jinja2_template: "{{ app_name | default('unknown') }}"

  - ocsf_field: metadata.product.vendor_name
    type: str
    default: "generic"

  - ocsf_field: unmapped.hostname
    type: str
    jinja2_template: "{{ hostname | default('') }}"

  - ocsf_field: unmapped.facility
    type: int
    jinja2_template: "{{ (pri | int) // 8 }}"

  - ocsf_field: unmapped.syslog_severity
    type: int
    jinja2_template: "{{ (pri | int) % 8 }}"

  - ocsf_field: unmapped.procid
    type: str
    jinja2_template: "{{ procid | default('-') }}"

  - ocsf_field: unmapped.msgid
    type: str
    jinja2_template: "{{ msgid | default('-') }}"

  - ocsf_field: unmapped.structured_data
    type: str
    jinja2_template: "{{ structured_data | default('-') }}"

static_values:
  severity_id: 1  # Informational — generic fallback doesn't infer severity
  activity_id: 0  # Unknown
