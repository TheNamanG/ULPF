[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ulpf"
version = "0.1.0"
description = "Universal Log Pre-processing Framework — vendor-agnostic, lossless log normalization to OCSF v1.3"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "SyntaxSentinels", email = "team@ulpf.dev"},
]
keywords = ["ocsf", "siem", "log-normalization", "cybersecurity", "syslog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0,<7",
    "jinja2>=3.1.5,<4",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "aiohttp>=3.10.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
uvloop = [
    "uvloop>=0.19,<1; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "ruff>=0.4,<1",
    "hypothesis>=6.100,<7",
    "types-PyYAML>=6.0",
    "types-aiofiles>=24.1",
]

[project.scripts]
ulpf = "ulpf.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ulpf"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["ulpf"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/ulpf"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
